<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table of Information Technology Students 2nd Year</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Prominent Main Title -->
        <header class="main-header">
            <h1>Time Table of Information Technology Students 2nd Year</h1>
            <p>Comprehensive weekly lecture, tutorial, and practical schedule</p>
        </header>

        <!-- Student Verification & Batch Selection Panel -->
        <section class="verification-card">
            <h2><i class="fa-solid fa-id-card"></i> Student Batch Verification</h2>
            <p class="verification-desc">Enter your Student ID and select your section to personalize your timetable view.</p>
            <form id="verification-form" onsubmit="handleVerification(event)">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="student-id">Student ID</label>
                        <div class="input-field-wrapper">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="student-id" placeholder="e.g. 20265012" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="section-select">Select Section / Batch</label>
                        <div class="input-field-wrapper">
                            <i class="fa-solid fa-users-rectangle"></i>
                            <select id="section-select" required>
                                <option value="" disabled selected>Select your section...</option>
                                <option value="IT-1">#IT-1 (Batch 1)</option>
                                <option value="IT-2">#IT-2 (Batch 2)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" class="apply-btn">
                    <span>Apply & View Schedule</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </section>

        <!-- Dynamic User Status Banner (Hidden initially, shown after submit) -->
        <div id="user-status-banner" class="status-banner" style="display: none;">
            <div class="status-text">
                Showing schedule for <strong id="display-student-id">--</strong> in section <strong id="display-section">--</strong>
            </div>
            <button class="reset-btn" onclick="resetVerification()">Change Details</button>
        </div>

        <!-- Controls / Day Filter Bar -->
        <div class="filter-card">
            <div class="filter-label"><i class="fa-solid fa-filter"></i> Filter by Day:</div>
            <div class="day-filter-btns" id="day-filters">
                <button class="filter-btn active" onclick="filterByDay('All', event)">All Days</button>
                <button class="filter-btn" onclick="filterByDay('Monday', event)">Monday</button>
                <button class="filter-btn" onclick="filterByDay('Tuesday', event)">Tuesday</button>
                <button class="filter-btn" onclick="filterByDay('Wednesday', event)">Wednesday</button>
                <button class="filter-btn" onclick="filterByDay('Thursday', event)">Thursday</button>
                <button class="filter-btn" onclick="filterByDay('Friday', event)">Friday</button>
                <button class="filter-btn" onclick="filterByDay('Saturday', event)">Saturday</button>
            </div>
        </div>

        <!-- Timetable Cards Container -->
        <div class="timetable-grid" id="timetable-output">
            <!-- Populated dynamically via JS -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
