<!-- 1. In your .nav-tabs div, add the Assignments tab button: -->
<div class="nav-tabs" role="tablist">
    <button class="nav-tab active" data-target="schedule" role="tab" aria-selected="true">📅 Timetable</button>
    <button class="nav-tab" data-target="assignments" role="tab" aria-selected="false">📋 Assignments</button>
    <button class="nav-tab" data-target="watch" role="tab" aria-selected="false">⏰ Clock</button>
    <button class="nav-tab" data-target="notes" role="tab" aria-selected="false">📝 Notes</button>
</div>

<!-- 2. Right after the #tab-schedule section, add this #tab-assignments block: -->
<div id="tab-assignments" class="tab-content hidden" role="tabpanel">
    <!-- Assignment Creation Box -->
    <div class="tracker-input-box">
        <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.85rem; color: var(--text-main);">Add Assignment or Task</h3>
        <div class="assignment-form-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="task-title">Task / Assignment Title</label>
                <input type="text" id="task-title" class="form-control" placeholder="e.g., DSA Lab 3 Assignment">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="task-subject">Subject</label>
                <select id="task-subject" class="form-control">
                    <option value="Data Structures">Data Structures</option>
                    <option value="Digital Electronics">Digital Electronics</option>
                    <option value="Automata Theory">Automata Theory</option>
                    <option value="Prob & Stats">Prob & Stats</option>
                    <option value="Tech Communication">Tech Communication</option>
                    <option value="FIT">FIT</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="task-due-date">Due Date</label>
                <input type="date" id="task-due-date" class="form-control">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="task-priority">Priority</label>
                <select id="task-priority" class="form-control">
                    <option value="High">🔴 High</option>
                    <option value="Medium" selected>🟡 Medium</option>
                    <option value="Low">🟢 Low</option>
                </select>
            </div>
        </div>
        <div id="task-error" class="error-text" aria-live="polite">Please enter a task title and valid due date.</div>
        <button class="btn" id="btn-add-task" style="margin-top: 1rem;">Add Assignment</button>
    </div>

    <!-- Filters & List Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem 0; flex-wrap: wrap; gap: 0.5rem;">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);">My Tasks</h3>
        <div class="task-filter-group">
            <button class="task-filter-btn active" data-filter="all">All</button>
            <button class="task-filter-btn" data-filter="pending">Pending</button>
            <button class="task-filter-btn" data-filter="completed">Done</button>
        </div>
    </div>

    <!-- Tasks List Container -->
    <div id="tasks-container" class="tasks-list"></div>
</div>
