<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT 2nd Year · NextGen Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1e7;--dim:rgba(246,241,231,.66);--glass:rgba(8,10,28,.46);--line:rgba(246,241,231,.16);--amber:#ffc857;--bad:#ff8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b1026}
body{margin:0;min-height:100vh;font:400 1rem/1.5 Figtree,system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden}
.sky::after{content:"";position:absolute;inset:0;opacity:var(--stars,0);background:
radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 24%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 8% 46%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 40%,#fff,transparent),radial-gradient(1px 1px at 35% 52%,#fff,transparent)}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;transform:translate(-50%,0);transition:left 1s,top 1s}
.orb.sun{background:radial-gradient(circle,#fff3c4 0 28%,#ffc857 48%,rgba(255,200,87,.35) 62%,transparent 72%)}
.orb.moon{width:96px;height:96px;background:#e9ecf5;box-shadow:inset -18px -6px 0 0 #aab2cc,0 0 70px 14px rgba(180,195,255,.3)}
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,5vw,2.5rem)}
.who{font-weight:600}.who small{display:block;font-weight:400;color:var(--dim)}
.ghost{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:.45rem 1rem;backdrop-filter:blur(12px)}
main{max-width:860px;margin:0 auto;padding:0 clamp(1rem,5vw,2rem) 8rem}
.big{font:800 clamp(2.3rem,8vw,5.2rem)/.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:.3rem 0 .8rem;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero{padding:min(22vh,9rem) 0 2rem;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.hero .when{color:var(--dim);font-weight:500}
.hero .sub{font-size:1.1rem;color:var(--ink)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:1.2rem;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}
.strip{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 1rem;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:.5rem 1rem;backdrop-filter:blur(12px);color:var(--dim)}
.chip[aria-pressed=true]{background:var(--ink);color:#12142b;font-weight:600;border-color:var(--ink)}
.chip.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:.45rem;vertical-align:middle}
h2.dayh{font:500 1.1rem "Bricolage Grotesque",sans-serif;margin:1.6rem 0 .6rem;color:var(--dim)}
.row{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;margin-bottom:.75rem;align-items:stretch}
.row time{color:var(--dim);font-size:.9rem;padding-top:1rem;text-align:right}
.card{background:var(--glass);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:.9rem 1.1rem;backdrop-filter:blur(14px)}
.card b{font-weight:600;display:block}
.card span{color:var(--dim);font-size:.9rem}
.card em{font-style:normal;float:right;margin-left:.8rem;font-weight:600;color:var(--c)}
.row.done{opacity:.45}
.row.live .card{box-shadow:0 0 0 1px var(--c),0 0 36px -4px var(--c);background:rgba(8,10,28,.68)}
.empty{color:var(--dim);padding:2rem 0}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:1.2rem;backdrop-filter:blur(14px)}
.chat{display:flex;flex-direction:column;gap:.7rem;padding:7rem 0 1rem}
.msg{max-width:86%;padding:.7rem 1rem;border-radius:16px;white-space:pre-wrap;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
.msg.me{align-self:flex-end;background:var(--ink);color:#12142b;border-color:var(--ink)}
.ask{display:flex;gap:.5rem;margin-top:.5rem}
.in{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.go{background:var(--amber);color:#2a1d00;border:0;border-radius:12px;padding:.7rem 1.2rem;font-weight:600}
.next{padding:min(20vh,7rem) 0 1.5rem}
.hrow{display:flex;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.hrow.past{opacity:.4;text-decoration:line-through}
.hrow>span:first-child{font-size:1.6rem}.hrow div{flex:1}.hrow small{display:block;color:var(--dim)}
.notes{display:grid;gap:.8rem;margin-top:1rem}
@media(min-width:640px){.notes{grid-template-columns:1fr 1fr}}
.note{display:flex;flex-direction:column;justify-content:space-between;gap:1rem;white-space:pre-wrap}
.note small{color:var(--dim)}
.del{background:none;border:1px solid var(--line);border-radius:8px;color:var(--bad);padding:.2rem .6rem;float:right}
.auth{min-height:80vh;display:grid;place-items:center;padding:1rem}
.auth form{width:min(420px,100%)}
.auth h1{font:800 clamp(2.4rem,9vw,3.6rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:0 0 .6rem}
.auth label{display:block;margin:1rem 0 .35rem;color:var(--dim);font-size:.9rem}
.seg{display:flex;gap:.5rem}
.seg label{flex:1;margin:0;text-align:center;padding:.7rem;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--ink);color:#12142b;font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--amber)}
.err{color:var(--bad);margin:.6rem 0 0}
.auth .go{width:100%;margin-top:1.4rem;padding:.9rem}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:.2rem;padding:.35rem;background:rgba(8,10,28,.72);border:1px solid var(--line);border-radius:99px;backdrop-filter:blur(18px);z-index:5}
.dock button{background:none;border:0;border-radius:99px;padding:.6rem 1.05rem;color:var(--dim)}
.dock button[aria-current=page]{background:var(--ink);color:#12142b;font-weight:600}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:#12142b;padding:.6rem 1.1rem;border-radius:99px;font-weight:600;transition:transform .3s;z-index:9}
.toast.on{transform:translate(-50%,0)}
@media(max-width:520px){.row{grid-template-columns:1fr;gap:.2rem}.row time{text-align:left;padding:0}}
@media(prefers-reduced-motion:reduce){.orb,.toast{transition:none}}
</style>
</head>
<body>
<div class="sky" id="sky"><i class="orb sun" id="orb"></i></div>

<div class="auth" id="auth">
  <form id="login">
    <h1>Your day, in the sky.</h1>
    <p style="color:var(--dim);margin:0">Enter your details to see today's classes.</p>
    <label for="nm">Full name</label><input class="in" id="nm" autocomplete="name" placeholder="Aditi Sharma">
    <label for="sid">Student ID</label><input class="in" id="sid" autocomplete="off" placeholder="24IT045">
    <label>Section</label>
    <div class="seg"><label><input type="radio" name="sec" value="1">IT-1</label><label><input type="radio" name="sec" value="2" checked>IT-2</label></div>
    <p class="err" id="err" hidden>Enter your name and student ID to continue.</p>
    <button class="go" type="submit">Show my day</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="who" id="who"></div><button class="ghost" id="out">Sign out</button></header>
  <main>
    <section id="v-day">
      <div class="hero" id="hero"></div>
      <div class="strip" id="strip" role="group" aria-label="Pick a day"></div>
      <div id="tl"></div>
    </section>
    <section id="v-ask" hidden>
      <div class="chat" id="log"><div class="msg">Ask me about any day's classes, who teaches a subject, where a class is, or the next holiday.</div></div>
      <div class="strip" id="sugg"></div>
      <form class="ask" id="askf"><input class="in" id="q" placeholder="Try: What's on Wednesday?" aria-label="Your question"><button class="go">Ask</button></form>
    </section>
    <section id="v-brk" hidden>
      <div class="next" id="nextbrk"></div>
      <div id="hol"></div>
    </section>
    <section id="v-notes" hidden>
      <div class="panel" style="margin-top:7rem">
        <label for="nt" style="display:block;color:var(--dim);margin-bottom:.5rem">New note</label>
        <textarea class="in" id="nt" rows="3" placeholder="A reminder, a formula, a to-do"></textarea>
        <p class="err" id="nerr" hidden>Write something before saving.</p>
        <div style="text-align:right;margin-top:.8rem"><button class="go" id="save">Save note</button></div>
      </div>
      <p style="color:var(--dim);font-size:.9rem">Notes are saved on this device only.</p>
      <div class="notes" id="notes"></div>
    </section>
  </main>
  <nav class="dock" id="dock" aria-label="Sections">
    <button data-v="day" aria-current="page">Day</button><button data-v="ask">Ask</button><button data-v="brk">Breaks</button><button data-v="notes">Notes</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const J="Mr. Sanjay Joshi",G="Dr. Govind Singh Kushwaha",A="Dr. Ashok Kumar",K="Prof. Arun Kumar",M="Mr. Jalaj Sharma",P="Dr. Shri Prakash Dwivedi";
const DSA="Data Structures and Algorithms",ETC="Effective Technical Communication",FIT="Foundations of Information Technology",DE="Digital Electronics",PS="Probability and Statistics",FLA="Formal Languages and Automata Theory";
const R="IT-202",PG="IT 202 / Golakota",CE="Comp Engg. Dept.";
// [day(1=Mon), start, end, subject, professor, venue, sections]
const RAW=[
[1,"11:00","12:00",DSA,J,R,"12"],[1,"12:00","13:00",ETC,G,R,"12"],[1,"15:00","16:00",FIT,A,R,"12"],
[2,"10:00","11:00",DSA,J,R,"12"],[2,"11:00","13:00",DE+" (Tutorial/Practical)",M,CE,"2"],[2,"14:00","15:00",PS+" (Tutorial)",K,PG,"1"],[2,"15:00","16:00",PS+" (Tutorial)",K,PG,"2"],[2,"16:00","17:00",FLA,P,R,"12"],
[3,"10:00","11:00",PS,K,PG,"12"],[3,"11:00","12:00",DE,M,R,"12"],[3,"12:00","13:00",FIT,A,R,"12"],[3,"15:00","17:00",DSA+" (Practical)",J,"IT-203","1"],[3,"15:00","17:00",FIT+" (Practical)",A,"IT-204","2"],
[4,"10:00","11:00",DSA,J,R,"12"],[4,"11:00","12:00",ETC,G,R,"12"],[4,"12:00","13:00",DE,M,R,"12"],[4,"15:00","17:00",DSA+" (Practical)",J,"IT-203","2"],
[5,"10:00","11:00",PS,K,PG,"12"],[5,"11:00","12:00",ETC,G,R,"12"],[5,"12:00","13:00",DE,M,R,"12"],[5,"15:00","17:00",DE+" (Practical)",M,CE,"1"],
[6,"09:00","11:00",FIT+" (Practical)",A,"IT-204","1"],[6,"11:00","12:00",FLA,P,R,"12"],[6,"12:00","13:00",PS,K,PG,"12"],[6,"14:00","18:00","NSS/NCC","","IT Complex","12"]
].map(r=>({d:r[0],s:tm(r[1]),e:tm(r[2]),sub:r[3],prof:r[4],ven:r[5],sec:r[6]}));
const HT={G:"Gazetted holiday",U:"University holiday",N:"National holiday"};
const HOL=[["2026-01-26","Republic Day","N","🇮🇳"],["2026-02-15","Mahashivratri","G","🔱"],["2026-03-03","Holika Dahan","G","🔥"],["2026-03-04","Holi","G","🎨"],["2026-03-19","Chetchand","G","🌊"],["2026-03-21","Eid-ul-Fitr","G","🌙"],["2026-03-26","Ram Navmi","G","🏹"],["2026-03-31","Mahavir Jayanti","G","🕊️"],["2026-04-03","Good Friday","G","⛪"],["2026-04-13","Approved by B.O.M.","U","🏛️"],["2026-04-14","Dr. Bheemrao Ambedkar B.day","G","📜"],["2026-05-01","Budh Purnima","G","☸️"],["2026-05-27","Eid-Ul-Zuha (Bakar-Eid)","G","🐑"],["2026-06-26","Moharram","G","🏴"],["2026-07-16","Harela","U","🌿"],["2026-08-15","Independence Day","N","🇮🇳"],["2026-08-26","Eid-E-Milad / Milad-Un-Nabi Barawafat","G","✨"],["2026-08-28","Rakshabandhan","G","🧵"],["2026-09-04","Shri Krishna Janmastmi","G","🪈"],["2026-09-17","Vishwakarma Pooja","G","⚙️"],["2026-10-02","Mahatma Gandhi Jayanti","N","🕊️"],["2026-10-20","Dushehra (Vidyadashmi)","G","🏹"],["2026-10-25","Maharishi Balmiki Jayanti","G","🪔"],["2026-11-07","Deepawali (Narak Chaturdashi)","G","🪔"],["2026-11-08","Deepawali","G","🪔"],["2026-11-10","Deepawali (Govardhan Pooja)","G","🐄"],["2026-11-11","Bhaijoo","G","👫"],["2026-11-20","Eigas-Bagwal","U","🪔"],["2026-11-24","Guru Nanak Jayanti / Guru Teghabadur Shahid Diwas","G","🪯"],["2026-12-25","Christmas Day","G","🎄"]]
.map(h=>({date:new Date(h[0]+"T00:00:00"),name:h[1],type:HT[h[2]],em:h[3]}));
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const $=id=>document.getElementById(id);
let user={name:"",id:"",sec:"2"},notes={},sel=1,view="day";

function tm(s){const[a,b]=s.split(":");return +a*60+ +b}
function fmt(m){let h=Math.floor(m/60);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m%60).padStart(2,"0")+" "+ap}
function hue(s){const b=s.replace(/ \(.*\)/,"");let h=0;for(const c of b)h=(h*31+c.charCodeAt(0))%360;return h}
const mine=()=>RAW.filter(c=>c.sec.includes(user.sec)).sort((a,b)=>a.s-b.s);
const dayList=d=>mine().filter(c=>c.d===d);
function store(get,key,val){try{if(get)return JSON.parse(localStorage.getItem(key));localStorage.setItem(key,JSON.stringify(val))}catch(e){return null}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const mins=m=>m>=60?Math.floor(m/60)+" hr"+(m%60?" "+m%60+" min":""):m+" min";
const dstr=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};

/* ---- sky ---- */
function paintSky(){
  const n=new Date(),t=n.getHours()+n.getMinutes()/60;
  const p=t<5||t>=20?["#070b1f","#1a2050",1]:t<8?["#2d2250","#b5605a",.25]:t<16?["#17456a","#3d86a0",0]:["#2b1d4a","#b34f5e",.15];
  $("sky").style.background=`linear-gradient(180deg,${p[0]},${p[1]})`;$("sky").style.setProperty("--stars",p[2]);
  document.documentElement.style.background=p[0];
  const o=$("orb"),day=t>=6&&t<18,q=day?(t-6)/12:((t<6?t+24:t)-18)/12;
  o.className="orb "+(day?"sun":"moon");
  o.style.left=(8+q*84)+"%";o.style.top=(6+(1-Math.sin(Math.PI*q))*38)+"vh";
}

/* ---- day view ---- */
function hero(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes(),d=n.getDay(),list=dayList(d);
  const live=list.find(c=>nm>=c.s&&nm<c.e),nx=list.find(c=>c.s>nm);
  const clock=n.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+", "+n.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"});
  let h=`<div class="when">${clock}</div>`;
  if(live){const pr=Math.round((nm-live.s)/(live.e-live.s)*100);
    h+=`<h1 class="big">${live.sub}</h1><div class="sub">${live.ven}${live.prof?" · "+live.prof:""}</div><div class="when" style="margin-top:.4rem">Ends at ${fmt(live.e)}, ${mins(live.e-nm)} left</div><div class="bar" role="progressbar" aria-valuenow="${pr}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pr}%"></i></div>`;
  }else if(nx){
    h+=`<h1 class="big">${nx.sub}</h1><div class="sub">${nx.ven}${nx.prof?" · "+nx.prof:""}</div><div class="when" style="margin-top:.4rem">Starts at ${fmt(nx.s)}, in ${mins(nx.s-nm)}</div>`;
  }else{
    let t="";for(let i=1;i<=7;i++){const dd=(d+i)%7,l=dayList(dd);if(l.length){t=`Next class: ${DAYS[dd]} at ${fmt(l[0].s)}, ${l[0].sub}.`;break}}
    h+=`<h1 class="big">${list.length?"Done for today.":"No classes today."}</h1><div class="sub">${t}</div>`;
  }
  $("hero").innerHTML=h;
}
function strip(){
  const td=new Date().getDay();
  $("strip").innerHTML=["All",1,2,3,4,5,6].map(v=>`<button class="chip${v===td?" today":""}" data-d="${v}" aria-pressed="${v===sel}">${v==="All"?"Whole week":DAYS[v]}</button>`).join("");
}
function row(c,st){const col=`hsl(${hue(c.sub)} 75% 68%)`;
  return `<div class="row ${st}" style="--c:${col}"><time>${fmt(c.s)} – ${fmt(c.e)}</time><div class="card"><em>${c.ven}</em><b>${c.sub}</b><span>${c.prof||"All students"}</span></div></div>`}
function timeline(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes(),td=n.getDay();
  const ds=sel==="All"?[1,2,3,4,5,6]:[sel];let h="";
  ds.forEach(d=>{const l=dayList(d);
    if(sel==="All")h+=`<h2 class="dayh">${DAYS[d]}</h2>`;
    if(!l.length){h+=`<div class="empty">No classes on ${DAYS[d]}.</div>`;return}
    h+=l.map(c=>row(c,d===td?(nm>=c.e?"done":nm>=c.s?"live":""):"")).join("")});
  $("tl").innerHTML=h;
}

/* ---- ask ---- */
function say(who,t){const m=document.createElement("div");m.className="msg "+who;m.textContent=t;$("log").appendChild(m);m.scrollIntoView({block:"end",behavior:"smooth"})}
function bot(raw){
  const q=raw.toLowerCase(),has=(...w)=>w.some(x=>new RegExp("\\b"+x+"\\b").test(q)),first=user.name.split(" ")[0]||"there";
  let d=DAYS.findIndex(x=>q.includes(x.toLowerCase()));if(has("today"))d=new Date().getDay();
  if(d===0)return "Sunday has no classes. Enjoy the day off.";
  if(d>0){const l=dayList(d);return l.length?`${DAYS[d]} for IT-${user.sec}:\n`+l.map(c=>`• ${fmt(c.s)}–${fmt(c.e)}: ${c.sub} in ${c.ven}${c.prof?" ("+c.prof+")":""}`).join("\n"):`No classes on ${DAYS[d]}.`}
  if(has("holiday","holidays","break","breaks","vacation")){const t=today0(),h=HOL.find(x=>x.date>=t);if(!h)return "No more holidays are listed for 2026.";const n=Math.round((h.date-t)/864e5);return `Next up: ${h.em} ${h.name} on ${dstr(h.date)}, ${n?n+" day"+(n>1?"s":"")+" away":"today"}.`}
  const T=[[["data structures","dsa"],DSA,J],[["digital electronics","de"],DE,M],[["automata","formal languages","flat"],FLA,P],[["probability","statistics","stats"],PS,K],[["communication","etc"],ETC,G],[["fit","foundations"],FIT,A]];
  const hit=T.find(t=>t[0].some(k=>k.includes(" ")?q.includes(k):has(k)));
  if(has("who","professor","teacher","teaches","faculty")){if(hit)return `${hit[1]} is taught by ${hit[2]}.`;return "Faculty:\n"+T.map(t=>`• ${t[1]}: ${t[2]}`).join("\n")}
  if(has("venue","room","where","location")){if(hit){const v=[...new Set(mine().filter(c=>c.sub.startsWith(hit[1])).map(c=>c.ven))];return `${hit[1]} meets at ${v.join(" and ")}.`}return "Most lectures are in IT-202. Labs use IT-203, IT-204 or the Comp Engg. Dept."}
  if(has("section"))return `You're signed in to IT-${user.sec}.`;
  if(has("hi","hello","hey"))return `Hi ${first}! Ask me about a day's classes, a professor, a room or the next holiday.`;
  return "I can look up a day's classes, professors, rooms and holidays. Try: What's on Wednesday?";
}
function send(t){t=t.trim();if(!t)return;say("me",t);$("q").value="";setTimeout(()=>say("bot",bot(t)),200)}

/* ---- breaks ---- */
function breaks(){
  const t=today0();let nx=null,h="";
  HOL.forEach(x=>{const past=x.date<t;if(!past&&!nx)nx=x;
    h+=`<div class="hrow${past?" past":""}"><span>${x.em}</span><div>${x.name}<small>${dstr(x.date)} · ${x.type}</small></div></div>`});
  if(nx){const n=Math.round((nx.date-t)/864e5);$("nextbrk").innerHTML=`<div class="when" style="color:var(--dim)">Next break</div><h1 class="big">${nx.em} ${nx.name}</h1><div class="sub">${n?n+" day"+(n>1?"s":"")+" to go":"Today"} · ${dstr(nx.date)}</div>`}
  else $("nextbrk").innerHTML=`<h1 class="big">No more breaks in 2026.</h1>`;
  $("hol").innerHTML=h;
}

/* ---- notes ---- */
const myNotes=()=>notes[user.id]||(notes[user.id]=[]);
function renderNotes(){
  const l=myNotes(),box=$("notes");box.innerHTML="";
  if(!l.length){box.innerHTML='<p class="empty" style="grid-column:1/-1">No notes yet. Write your first one above.</p>';return}
  l.forEach(n=>{const c=document.createElement("div");c.className="panel note";
    const t=document.createElement("div");t.textContent=n.text;
    const f=document.createElement("small");f.textContent=n.at;
    const b=document.createElement("button");b.className="del";b.textContent="Delete";b.onclick=()=>{notes[user.id]=l.filter(x=>x.id!==n.id);store(0,"nx_notes",notes);renderNotes()};
    f.appendChild(b);c.append(t,f);box.appendChild(c)});
}

/* ---- shell ---- */
function go(v){view=v;["day","ask","brk","notes"].forEach(x=>$("v-"+x).hidden=x!==v);
  document.querySelectorAll("#dock button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  scrollTo(0,0)}
function enter(auto){
  $("auth").hidden=true;$("app").hidden=false;
  $("who").innerHTML="";const a=document.createElement("span");a.textContent=user.name.split(" ")[0];
  const s=document.createElement("small");s.textContent=`IT-${user.sec} · ${user.id}`;$("who").append(a,s);
  const d=new Date().getDay();sel=d===0?1:d;
  strip();timeline();hero();breaks();renderNotes();paintSky();go("day");
  if(!auto)toast("Signed in")}
$("login").onsubmit=e=>{e.preventDefault();const n=$("nm").value.trim(),i=$("sid").value.trim();
  if(!n||!i){$("err").hidden=false;return}$("err").hidden=true;
  user={name:n,id:i,sec:document.querySelector("input[name=sec]:checked").value};store(0,"nx_user",user);enter(false)};
$("out").onclick=()=>{try{localStorage.removeItem("nx_user")}catch(e){}$("app").hidden=true;$("auth").hidden=false;$("login").reset()};
$("dock").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)};
$("strip").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=b.dataset.d==="All"?"All":+b.dataset.d;strip();timeline()};
$("askf").onsubmit=e=>{e.preventDefault();send($("q").value)};
$("sugg").innerHTML=["Monday schedule","Who teaches Data Structures?","Next holiday","Where is Probability?"].map(t=>`<button class="chip" data-q="${t}">${t}</button>`).join("");
$("sugg").onclick=e=>{const b=e.target.closest("button");if(b)send(b.dataset.q)};
$("save").onclick=()=>{const v=$("nt").value.trim();if(!v){$("nerr").hidden=false;return}$("nerr").hidden=true;
  myNotes().unshift({id:Date.now(),text:v,at:new Date().toLocaleString()});store(0,"nx_notes",notes);$("nt").value="";renderNotes();toast("Note saved")};

notes=store(1,"nx_notes")||{};
const saved=store(1,"nx_user");
if(saved&&saved.name){user=saved;enter(true)}else{paintSky()}
setInterval(()=>{paintSky();if(!$("app").hidden&&view==="day"){hero();if(sel==="All"||sel===new Date().getDay())timeline()}},1000);
</script>
</body>
